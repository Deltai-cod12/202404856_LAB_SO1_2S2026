services:

  valkey:
    image: valkey/valkey:8-alpine
    container_name: so1-valkey

    ports:
      - "6379:6379"

    volumes:
      - valkey-data:/data

    command:
      - valkey-server
      - --appendonly
      - "yes"

    restart: unless-stopped

    labels:
      so1.system: "true"

volumes:
  valkey-data: